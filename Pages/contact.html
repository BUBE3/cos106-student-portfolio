        <span class="tag-indicator">Secure Pipeline Interface</span>
        <h1>Get In Touch</h1>
        <p style="color: var(--text-muted); margin-bottom: 20px;">Submit data metrics or project proposals below.</p>
        
        <!-- EMAIL PIPELINE LINK INTEGRATED HERE -->
        <!-- Replace 'YOUR_FORMSPREE_ID' with the free key you get from formspree.io -->
        <form id="contactForm" action="https://formspree.io/f/xdeaqynj" method="POST">
            <div class="form-group">
                <label>Full Corporate Name</label>
                <input type="text" id="name" name="name" placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>Email  Address</label>
                <input type="text" id="email" name="email" placeholder="name@domain.com">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" id="phone" name="phone" placeholder="09012345678">
            </div>
            <div class="form-group">
                <label>Message Matrix Payload</label>
                <textarea id="message" name="message" rows="5" placeholder="Enter message please"></textarea>
            </div>
            <button type="submit" style="width: 100%;">Transmit Parameters</button>
        </form>
    </main>
